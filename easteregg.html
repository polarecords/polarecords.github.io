                <div class="output-line">"Over 1,600 voice memos, freestyle sessions, and late-night recordings."</div>
                <div class="output-line">------------------------------------</div>

                <div class="log-stream">
                    <div class="log-entry">
                        <span class="log-time">VOICE 223 // GENESIS</span>
                        <span class="log-msg highlight">"Snowy Skies" — Early Flight Recording (Pre-Rec ATL Airport)</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">VOICE 559 // IDENTITY</span>
                        <span class="log-msg">"Who I Am" — Melodic Vocal Arcs & Airport Cadences</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">VOICE 590 // TURNING POINT</span>
                        <span class="log-msg highlight">"Pain · Strain · Disdain" — "Tired of the rage, this is your stage."</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">VOICE 672 // FREESTYLE</span>
                        <span class="log-msg">Raw Acoustic Melody & Vocal Sketches</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">VOICE 751 // MOVEMENT</span>
                        <span class="log-msg">"Move (Groove)" / "Davy Jones Rap"</span>
                    </div>
                    <div class="log-entry">
                        <span class="log-time">DEVELOPMENT ERAS</span>
                        <span class="log-msg">XC Travel → Uber Nights → Auctioneer's Assistant → Birmingham Bandstand</span>
                    </div>
                </div>

                <div class="output-line">------------------------------------</div>
                <div class="output-line">ARCHIVE REGISTER: Verified across 1,633 local catalogued audio files.</div>
                <div class="back-btn" onclick="show('home')">[ Back ]</div>`,

            philosophy: `
                <div class="output-line"><span class="highlight">POLAR PHILOSOPHY & MANIFESTO</span></div>
                <div class="output-line">"To escape the noise in your mind and in your life you must first be quiet."</div>
                <div class="output-line">------------------------------------</div>

                <div style="background: rgba(111, 214, 200, 0.05); border-left: 2px solid var(--primary); padding: 14px 18px; margin: 14px 0; font-size: 14px; line-height: 1.7;">
                    "Time. Peace. Patience. Tranquility. Stillness. Quiet.<br><br>
                    Synchronicity is taking shape — the patterns and parallels have run their course.
                    We reached a crossroads, and it became time to see where the music could go.
                    The hat and dark sunglasses mark the transition from everyday noise into the character:
                    making room for contrast, raw sound, and authentic expression.<br><br>
                    Just a guy making sense of the madness through the music."
                </div>

                <div class="output-line">------------------------------------</div>
                <div class="output-line">AUTHOR: <span class="highlight">John Polar / thejaustin</span></div>
                <div class="back-btn" onclick="show('home')">[ Back ]</div>`
        };

        function show(key) {
            const fetching = document.getElementById('fetching');
            output.style.display = 'none';
            fetching.style.display = 'block';

            const originalText = "DECRYPTING PølaRecørds DATA STREAM";
            const chars = "!@#$%^&*()_+1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let iterations = 0;

            const interval = setInterval(() => {
                fetching.innerText = originalText.split("").map((char, index) => {
                    if (index < iterations) return originalText[index];
                    return chars[Math.floor(Math.random() * chars.length)];
                }).join("");
                if (iterations >= originalText.length) clearInterval(interval);
                iterations += 1/3;
            }, 30);

            setTimeout(() => {
                fetching.style.display = 'none';
                output.style.display = 'block';
                output.innerHTML = content[key];
                document.getElementById("terminal").className = "theme-" + key;
                document.getElementById('terminal').scrollTop = 0;

                document.querySelectorAll('.log-entry').forEach((el, i) => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateX(-10px)';
                    el.style.transition = 'all 0.3s ease';
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translateX(0)';
                    }, i * 50);
                });
            }, 800);
        }

        userInput.addEventListener('keydown', async (e) => {
            if (e.key !== 'Enter') return;
            const command = userInput.value.trim().toLowerCase();
            userInput.value = '';
            if (!command) return;

            const echoDiv = document.createElement('div');
            echoDiv.className = 'output-line highlight';
            echoDiv.textContent = `> ${command}`;
            output.appendChild(echoDiv);

            const responseDiv = document.createElement('div');
            responseDiv.className = 'output-line';
            output.appendChild(responseDiv);

            async function typeResponse(text) {
                responseDiv.textContent = '';
                for (let i = 0; i < text.length; i++) {
                    responseDiv.textContent += text[i];
                    await new Promise(r => setTimeout(r, 15));
                }
                window.scrollTo(0, document.body.scrollHeight);
            }

            const commands = {
                home: 'home',
                john: 'john',
                project: 'project',
                lore: 'project',
                history: 'project',
                audio: 'audio',
                tracks: 'audio',
                memos: 'memos',
                voicenotes: 'memos',
                notes: 'memos',
                philosophy: 'philosophy',
                quotes: 'philosophy',
                manifesto: 'philosophy',
                rebe: 'rebe',
                photos: 'rebe',
                polaraf: 'polaraf',
                band: 'polarband',
                media: 'media'
            };

            if (command === 'help') {
                await typeResponse('AVAILABLE COMMANDS: home, john, project, audio, memos, philosophy, rebe, polaraf, band, media, clear, whoami, sudo override');
            } else if (commands[command]) {
                show(commands[command]);
            } else if (command === 'clear') {
                output.innerHTML = '';
                await typeResponse('Terminal cleared. Type "home" to return.');
            } else if (command === 'whoami') {
                await typeResponse('AUTHORIZED GUEST / SIGNAL INTERCEPTOR // BIRMINGHAM_AL_NODE_01');
            } else if (command === 'sudo override') {
                document.body.style.backgroundColor = 'var(--primary)';
                document.body.style.color = 'var(--terminal-black)';
                await typeResponse('CRITICAL: MANUAL OVERRIDE INITIATED. MATRIX BYPASS IN PROGRESS...');
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                    document.body.style.color = '';
                    responseDiv.textContent = 'BYPASS FAILED. INSUFFICIENT CLEARANCE.';
                }, 3000);
            } else {
                await typeResponse(`COMMAND_NOT_FOUND: ${command}. Type 'help' for directory.`);
            }
        });

        document.getElementById('terminal').addEventListener('click', () => userInput.focus());

        show('home');
        userInput.focus();
    </script>
</body>
</html>
